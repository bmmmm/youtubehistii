name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/check.sh stamps the binary with `git describe --tags`. A
          # shallow checkout has no tags, so the version would silently be
          # "dev" in the only place it is built the same way a release is.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          # 'stable' tracks the latest release; pin (e.g. '1.26') only when the
          # repo must stay on an older toolchain.
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          # pagecheck runs the page's own JavaScript; the last gate in the
          # script needs a node on PATH or it stops.
          node-version: '24'
      # One script, not a list of steps: the gates live in scripts/check.sh so
      # that what CI runs and what a developer runs are the same six commands
      # in the same order. Adding a gate here without adding it there is how
      # "it passed locally" starts meaning nothing.
      - run: scripts/check.sh
