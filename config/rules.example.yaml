# youtubehistii classification rules — copy to config/rules.yaml and edit.
#
# This example is deliberately generic: it demonstrates the format, not a
# recommended taxonomy. Replace the topics with the ones that describe YOUR
# watching — the more discriminating they are, the better both stages work.
#
# Two axes per video:
#   topic — free-form slug, convention "<area>/<sub>" (e.g. tech/talks)
#   mode  — consume | learn | mixed
#
# Stage 1 walks `rules` top to bottom; the FIRST matching rule wins, so put
# specific rules (channels) before broad fallbacks (YouTube categories).
# Stage 2 sends whatever stage 1 left unmatched to the local LLM (oMLX),
# constrained to the topics listed here. Every verdict records its source
# (rule id or model name) — nothing is classified invisibly.

llm:
  model: Qwen3.5-9B-MLX-4bit # any model your oMLX server has pulled
  # base_url: http://127.0.0.1:8000/v1   # default; or env OMLX_URL

# The taxonomy. `desc` is shown to the LLM, so make it discriminating.
# A topic with id "unclear" is required — it is the model's escape hatch.
topics:
  - id: gaming
    desc: video game content — gameplay, let's plays, esports
  - id: tech/talks
    desc: software engineering conference talks and technical deep dives
  - id: tech/tutorials
    desc: programming tutorials, courses, how-tos
  - id: science
    desc: science, engineering, documentaries
  - id: news
    desc: news, politics, commentary
  - id: music
    desc: music videos, live sets, concerts
  - id: sports
    desc: sports broadcasts, highlights, analysis
  - id: entertainment
    desc: comedy, vlogs, memes, everything watched purely for fun
  - id: unclear
    desc: cannot tell from the available metadata

# Matchers per rule (all optional, all case-insensitive; a rule fires when
# ANY of its listed values matches its field):
#   channel_any  — exact channel name
#   title_any    — substring of the video title
#   tag_any      — exact creator tag (only after `enrich`)
#   text_any     — substring of title OR any tag
#   category_any — official YouTube category (only after `enrich`)
rules:
  # --- channels: the strongest signal. List the handful of channels you watch
  # most; one exact name per entry, and put these rules first.
  - id: conference-channel
    channel_any: ["Example Conference Channel"]
    topic: tech/talks
    mode: learn

  # --- title keywords
  - id: conference-talk
    title_any: ["keynote", "conf talk", "conference"]
    topic: tech/talks
    mode: learn
  - id: tutorial
    title_any: ["tutorial", "how to", "crash course", "explained"]
    topic: tech/tutorials
    mode: learn

  # --- text_any looks in the title AND in the creator tags
  - id: gameplay
    text_any: ["gameplay", "let's play", "walkthrough", "speedrun"]
    topic: gaming
    mode: consume

  # --- tag_any needs an EXACT creator tag (available only after `enrich`)
  - id: live-music
    tag_any: ["live session", "live concert"]
    topic: music
    mode: consume

  # --- broad fallbacks via official YouTube category (needs `enrich`)
  - id: category-gaming
    category_any: ["Gaming"]
    topic: gaming
    mode: consume
  - id: category-music
    category_any: ["Music"]
    topic: music
    mode: consume
  - id: category-sports
    category_any: ["Sports"]
    topic: sports
    mode: consume
  - id: category-news
    category_any: ["News & Politics"]
    topic: news
    mode: consume
  - id: category-education
    category_any: ["Education", "Science & Technology"]
    topic: science
    mode: learn
